services:
  server:
    build:
      context: .
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
    ports:
      - "5000:5000"
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: codeexecution
    volumes:
      - db-data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: standalone judge worker process (async queue consumer)
  # Uncomment to enable horizontal scaling with Redis queue
  # worker:
  #   build:
  #     context: .
  #   command: ["node", "--experimental-strip-types", "src/worker.ts"]
  #   environment:
  #     NODE_ENV: production
  #     REDIS_URL: redis://redis:6379
  #   depends_on:
  #     - redis
  #     - db
  #   restart: unless-stopped

volumes:
  db-data:
